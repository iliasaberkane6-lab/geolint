  <h1>Docs</h1>
  <h2>How do I install Acme Notes?</h2>
  <p>Clone the repo and run <code>./acme init</code>. Done in 30 seconds.</p>
  <h2>How does sync work?</h2>
  <p>Every save is a git commit. Push to any remote to sync.</p>
  <h2>Can I use it offline?</h2>
  <p>Yes — Acme Notes is offline-first by design.</p>
