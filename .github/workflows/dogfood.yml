name: Dogfood metrics

on:
  schedule:
    - cron: '17 5 * * *' # daily ~05:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed metrics/ back to the repo

concurrency: dogfood-metrics

jobs:
  scan:
    name: Scan sites & commit metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Scans every site in SITES (scripts/dogfood.mjs), writes
      # metrics/<slug>.{json,svg,endpoint.json} and regenerates
      # metrics/README.md. A site that fails never aborts the run.
      - run: node scripts/dogfood.mjs

      # Plain git, no third-party commit action. [skip ci] keeps the metrics
      # push from retriggering the CI workflow.
      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/
          if git diff --cached --quiet; then
            echo "metrics unchanged — nothing to commit"
          else
            git commit -m "chore(metrics): nightly geolint scan [skip ci]"
            git push
          fi
