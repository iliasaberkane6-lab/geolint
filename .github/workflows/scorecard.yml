name: Scorecard supply-chain security

on:
  # Re-run when branch protection settings change.
  branch_protection_rule:
  # Weekly, so the score tracks the project even without commits.
  schedule:
    - cron: '30 6 * * 2'
  push:
    branches: [main]

# Default to read-only; the job escalates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to OpenSSF REST API
      actions: read # read workflow runs for the CI-Tests check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
