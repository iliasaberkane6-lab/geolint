name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # npm --provenance (Sigstore OIDC)

jobs:
  publish:
    name: Publish to npm + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Maintainer note: after cutting a release, float the major-version tag
      # so `uses: iliasaberkane/geolint@v1` keeps tracking the latest v1.x:
      #   git tag -f v1 v1.x.y && git push -f origin v1
