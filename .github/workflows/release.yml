name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # npm --provenance (Sigstore OIDC)

jobs:
  publish:
    name: Publish to npm + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Idempotent: if the version is already on npm (e.g. published manually
      # before the tag existed, or registry propagation raced an earlier push),
      # publishing is skipped — and a failed publish is tolerated only when the
      # version is verifiably live.
      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version --silent > /dev/null 2>&1; then
            echo "${PKG}@${VER} already on npm — skipping publish."
            exit 0
          fi
          if npm publish --provenance --access public; then
            exit 0
          fi
          # Registry propagation can lag a manual publish by minutes — a 409 on
          # a version that then becomes visible is not a real failure.
          for i in 1 2 3 4 5 6; do
            sleep 20
            if npm view "${PKG}@${VER}" version --silent > /dev/null 2>&1; then
              echo "${PKG}@${VER} visible after publish conflict — treating as published."
              exit 0
            fi
          done
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      # Maintainer note: after cutting a release, float the major-version tag
      # so `uses: iliasabk/geolint@v1` keeps tracking the latest v1.x:
      #   git tag -f v1 v1.x.y && git push -f origin v1
